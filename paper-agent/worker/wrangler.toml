name = "paper-agent"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Serve the Worker at https://ask.naokiwake.com (the zone must be on this Cloudflare account).
routes = [
  { pattern = "ask.naokiwake.com", custom_domain = true }
]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://naokiwake.com,https://www.naokiwake.com"

# Per-IP limit: 6 questions per minute. Free-tier Gemini quotas cap daily usage on top of this.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2610"
simple = { limit = 6, period = 60 }

# Secret (never commit): npx wrangler secret put GEMINI_API_KEY
