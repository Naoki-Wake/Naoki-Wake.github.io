name: Deploy paper agent

on:
  push:
    branches: [main]
    paths:
      - "paper-agent/**"
      - ".github/workflows/deploy-paper-agent.yml"
  workflow_dispatch:

concurrency:
  group: deploy-paper-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch paper texts from arXiv
        run: python3 scripts/fetch_papers.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paper-agent/worker/package-lock.json

      - name: Build corpus
        working-directory: paper-agent/worker
        run: npm ci && npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: paper-agent/worker
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Health check
        run: |
          sleep 10
          curl -fsS https://ask.naokiwake.com/health
